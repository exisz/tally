<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self'; img-src 'self' data:; connect-src 'self';" />
    <title>Tally</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
      type="text/css"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0f17;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(124,58,237,0.18), transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(54,211,153,0.10), transparent 50%),
          #0b0f17;
      }
      .hero-content { max-width: 720px; padding: 0 32px; text-align: center; }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border: 1px solid rgba(124,58,237,0.5);
        border-radius: 9999px;
        color: #a78bfa;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 16px;
      }
      .accent { color: #a78bfa; }
      p.lede { font-size: 17px; opacity: 0.75; margin: 0; }
      .meta {
        margin-top: 28px;
        font-size: 12px;
        opacity: 0.45;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main class="hero" data-testid="tally-hero">
      <div class="hero-content">
        <div class="badge">Stage 0 · PLANET-1470</div>
        <h1>
          <span class="accent">Tally</span> — agent-era ActivityWatch
        </h1>
        <p class="lede">
          A native desktop shell for your local activity stream. The supervisor,
          the watchers, the cloud sync, and the agent API land in the next stories
          under the parent epic.
        </p>
        <div class="meta">tally v0.1.0-rc.0 · local-first · E2EE-ready</div>
      </div>
    </main>
    <script>
      // Tag the window for the e2e harness so we can prove "ready" deterministically.
      document.documentElement.setAttribute('data-tally-ready', '1');
      if (window.tally) {
        document.title = 'Tally';
      }
    </script>
  </body>
</html>
