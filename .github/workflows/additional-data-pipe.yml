name: Additional data pipe report

on:
  push:
    branches: [main]
    paths:
      - 'src/bridge/**'
      - 'tests/bridge/**'
      - 'scripts/build-dashboard-root.sh'
      - 'scripts/write-test-status.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/additional-data-pipe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tally-additional-data-pipe-pages
  cancel-in-progress: true

jobs:
  report:
    name: Headless Vitest bridge report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Run single additional-data-pipe suite
        run: pnpm test:report
      - name: Build dashboard shell
        run: |
          set -euo pipefail
          mkdir -p public/additional-data-pipe
          cp -R test-results/html/. public/additional-data-pipe/

          # Preserve the existing trend history for this one component suite.
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:additional-data-pipe/results.csv > /tmp/existing-results.csv 2>/dev/null || true
          if [ -s /tmp/existing-results.csv ]; then
            tail -n +2 public/additional-data-pipe/results.csv >> /tmp/existing-results.csv
            mv /tmp/existing-results.csv public/additional-data-pipe/results.csv
          fi

          scripts/build-dashboard-root.sh public
      - name: Deploy component report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
