name: Desktop tests (PLANET-1494)

# Stage 0 (PLANET-1513): the desktop Electron app does not exist yet — these tests
# import production modules that won't be written until Stage 1+ (PLANET-1471 onward).
# We keep the workflow file as the source of truth for HOW it will run once the
# desktop app lands, but disable automatic triggers so CI does not drown in red noise.
#
# To run manually: Actions → "Desktop tests (PLANET-1494)" → "Run workflow".

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Unit
        run: pnpm test:unit
      - name: Integration
        run: pnpm test:integration
      - name: E2E (Playwright Electron)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
