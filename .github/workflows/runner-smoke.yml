name: Self-hosted Runner Smoke
# PLANET-1523 — confirms mac-mini self-hosted runner is online and usable.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, macOS, arm64, mac-mini]
    timeout-minutes: 5
    steps:
      - name: System info
        run: |
          set -eux
          uname -a
          sw_vers || true
          echo "node: $(node -v 2>/dev/null || echo missing)"
          echo "pnpm: $(pnpm -v 2>/dev/null || echo missing)"
          echo "hostname: $(hostname)"
