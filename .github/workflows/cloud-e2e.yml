name: Cloud E2E (Playwright)

# PLANET-1524 — Cloud surface of the Tally dashboard.
# Was .github/workflows/e2e.yml. Renamed + retargeted to publish under
# the gh-pages `cloud/` subfolder; root index.html aggregates all surfaces.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'  # daily 22:00 UTC (08:00 Sydney)
  workflow_dispatch:

concurrency:
  group: cloud-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TALLY_CLOUD_BASE_URL: https://tally.rollersoft.com.au
      E2E_SECRET: ${{ secrets.E2E_SECRET }}
      TALLY_AGENT_TEST_TOKEN: ${{ secrets.TALLY_AGENT_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @tally/cloud exec playwright install --with-deps chromium

      - name: Wait for Vercel deploy
        run: |
          echo "Probing $TALLY_CLOUD_BASE_URL …"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TALLY_CLOUD_BASE_URL")
            if [ "$CODE" = "200" ]; then
              echo "✅ Site reachable (HTTP $CODE) after ${i}0s"
              exit 0
            fi
            echo "  attempt $i/30 — got HTTP $CODE"
            sleep 10
          done
          echo "⚠️ Timeout waiting for deploy, running tests anyway"

      - name: Run cloud e2e tests
        id: tests
        continue-on-error: true
        run: pnpm --filter @tally/cloud exec playwright test
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: apps/cloud/test-results/results.json

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloud
          path: |
            apps/cloud/playwright-report/
            apps/cloud/test-results/
          retention-days: 30

      - name: Stage cloud surface for gh-pages
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p public/cloud

          REPORT_DIR="apps/cloud/playwright-report"
          if [ -f "$REPORT_DIR/index.html" ]; then
            cp -r "$REPORT_DIR"/* public/cloud/
          else
            cat > public/cloud/index.html <<'PLACEHOLDER'
          <!DOCTYPE html><html><head><title>Tally Cloud E2E</title></head>
          <body style="font-family:system-ui;max-width:720px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb">
          <h1>☁️ Tally Cloud E2E</h1><p>No report available for this run. See
          <a style="color:#a78bfa" href="https://github.com/exisz/tally/actions">Actions</a>.</p>
          </body></html>
          PLACEHOLDER
          fi
          if [ -d apps/cloud/test-results ]; then
            cp -r apps/cloud/test-results public/cloud/test-results || true
          fi

          # status.json (consumed by root dashboard badge)
          RESULTS="apps/cloud/test-results/results.json"
          if [ -f "$RESULTS" ]; then
            jq -c '{
              surface: "cloud",
              passed: (.stats.expected // 0),
              failed: (.stats.unexpected // 0),
              flaky:  (.stats.flaky // 0),
              skipped:(.stats.skipped // 0),
              duration: (.stats.duration // 0),
              ts: now | todate,
              sha: env.GITHUB_SHA
            }' "$RESULTS" > public/cloud/status.json
          else
            echo '{"surface":"cloud","passed":0,"failed":0,"duration":0,"ts":""}' > public/cloud/status.json
          fi

          # results.csv — fetch existing series from gh-pages, append latest row.
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:cloud/results.csv > public/cloud/results.csv 2>/dev/null \
            || echo "timestamp,sha,duration,total,passed,failed" > public/cloud/results.csv
          if [ -f "$RESULTS" ]; then
            DURATION=$(jq '.stats.duration // 0' "$RESULTS")
            EXPECTED=$(jq '.stats.expected // 0' "$RESULTS")
            UNEXPECTED=$(jq '.stats.unexpected // 0' "$RESULTS")
            FLAKY=$(jq '.stats.flaky // 0' "$RESULTS")
            SKIPPED=$(jq '.stats.skipped // 0' "$RESULTS")
            TOTAL=$((EXPECTED + UNEXPECTED + FLAKY + SKIPPED))
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),${{ github.sha }},$DURATION,$TOTAL,$EXPECTED,$UNEXPECTED" >> public/cloud/results.csv
          fi

      - name: Build dashboard root (Desktop / Cloud / Releases)
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-dashboard-root.sh public

      - name: Deploy cloud surface + root to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Notify Discord on failure
        if: always()
        env:
          WEBHOOK_URL: https://linux.queue-musical.ts.net/webhook/hook/tally-e2e
        run: |
          curl -s -o /dev/null -w "router POST: %{http_code}\n" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: workflow_run" \
            -d '{
              "action":"completed",
              "workflow_run":{
                "name":"Cloud E2E (Playwright)",
                "conclusion":"${{ steps.tests.outcome }}",
                "status":"completed",
                "head_branch":"${{ github.ref_name }}",
                "head_sha":"${{ github.sha }}",
                "html_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "repository":{"full_name":"${{ github.repository }}"},
              "sender":{"login":"${{ github.actor }}"}
            }'
